# The leak guard in CI. Three layers protect every change headed for the public repository:
#   1. the push guard (scripts/hooks/pre-push, on each developer's machine) and THIS workflow's `guard` job, instant and free;
#   2. an AI read of each pull request's diff (the `ai-diff-read` job below), off unless the ANTHROPIC_API_KEY secret is set;
#   3. a review per tagged release (done by people, not here).
# The private instance denylist ($CREWBOSS_HOME/denylist.txt) is not available here; it runs in each developer's hooks. What CI
# checks without it: gitleaks over the whole pushed/PR history, the instance-reference ratchet, the built-in secret patterns, and
# the generic public denylist (RFC1918 and CGNAT address literals, as a ratchet on the tree and a hard block on added lines).
name: guard
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Install gitleaks
        run: |
          # Pinned release. To bump it: change the version here and run `gitleaks version` locally first.
          V=8.18.4
          SUM=ba6dbb656933921c775ee5a2d1c13a91046e7952e9d919f9bac4cec61d628e7d   # from the release's gitleaks_${V}_checksums.txt
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_x64.tar.gz" -o /tmp/gitleaks.tgz
          echo "${SUM}  /tmp/gitleaks.tgz" | sha256sum -c -
          sudo tar -xzf /tmp/gitleaks.tgz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Work out the range this run covers
        id: range
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REF: ${{ github.ref }}
        run: |
          # The logic lives in scripts/ci_guard.sh (tests/test_push_guard.py runs the same script against scratch repos).
          bash scripts/ci_guard.sh range >> "$GITHUB_OUTPUT"
      - name: Code owners placeholder
        run: |
          if grep -q '@OWNER' .github/CODEOWNERS; then
            echo "::warning title=CODEOWNERS is still a placeholder::.github/CODEOWNERS names @OWNER, so nobody is required to review changes to the guards. Replace it with the real owner."
          fi
      - name: Gitleaks over the commits of this push or pull request
        env:
          LOG_OPTS: ${{ steps.range.outputs.log_opts }}
        run: gitleaks detect --source . --config .gitleaks.toml --log-opts="$LOG_OPTS" --redact --no-banner --exit-code 1
      - name: instance-reference ratchet
        run: |
          pip install pytest
          python -m pytest --noconftest -p no:cacheprovider -q tests/test_no_*_refs.py
      - name: Migration lint (schema only; instance data stays out of db/migrations)
        run: python3 scripts/migration_lint.py
      - name: Commit guard (built-in patterns, internal-address ratchet, gitleaks over the tree)
        run: python3 scripts/commit_guard.py --strict --gitleaks-tree
      - name: What this push or pull request ADDS (history, messages, paths, ref and tag text, file names, binaries, baseline)
        env:
          RANGE: ${{ steps.range.outputs.range }}
          BASE: ${{ steps.range.outputs.base }}
          EXCLUDE: ${{ steps.range.outputs.exclude }}
          TIP_ONLY: ${{ steps.range.outputs.tip_only }}
          REF_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          # Without the private denylist, CI checks secret patterns and internal addresses over every ADDED line (a merge's conflict
          # resolution too), commit messages and author names, file paths, the ref name and annotated tag text; refuses secret-bearing
          # file names and binary blobs (every one, at the commit that added it) outside scripts/binary-allow.txt or whose bytes do
          # not match; and fails if the address baseline rose against BASE.
          bash scripts/ci_guard.sh run

  # Per-merge AI read of the diff. Runs only on pull requests, and does nothing unless the repository secret ANTHROPIC_API_KEY is
  # set (Settings > Secrets and variables > Actions). A pull request from a fork gets no secrets, so it skips cleanly. It uses
  # `pull_request`, never `pull_request_target`, so the pull request's own code never runs with the secret and the secret never
  # reaches a fork. Only the diff text goes to the API. Mark this job as a required check in branch protection to enforce it.
  ai-diff-read:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Read the diff with Claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::warning title=AI diff read skipped::No ANTHROPIC_API_KEY secret here (not configured, or a fork pull request): this diff was NOT read by Claude. A maintainer should read it."
            exit 0
          fi
          git diff --no-color --no-ext-diff "${PR_BASE}...${PR_HEAD}" > "$RUNNER_TEMP/pr.diff"
          python3 scripts/ai_diff_read.py "$RUNNER_TEMP/pr.diff"
