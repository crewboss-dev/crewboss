<li class="flex items-start gap-2 py-1.5 border-b border-line" data-proposed-add="{{ a.id }}">
  <span class="shrink-0 mt-0.5 inline-flex items-center justify-center w-[18px] h-[18px] rounded-md border-2 border-dashed border-status-ok/60 text-status-ok" aria-hidden>
    <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  </span>
  <div class="min-w-0 flex-1 rounded-md bg-status-ok/[.07] px-2 py-1.5">
    <span class="text-micro font-semibold uppercase tracking-wide text-status-ok">+ proposed</span>
    <div class="text-small leading-snug break-words">{{ a.text }}</div>
    <div class="flex gap-1.5 mt-1.5">
      <button type="button" class="btn-primary text-micro py-0.5 px-2" hx-post="{{ base }}/subtasks/{{ a.id }}/proposal/accept"
              hx-target="#task-checklist" hx-swap="outerHTML">Accept</button>
      <button type="button" class="btn-ghost text-micro py-0.5 px-2" hx-post="{{ base }}/subtasks/{{ a.id }}/proposal/reject"
              hx-target="#task-checklist" hx-swap="outerHTML">Reject</button>
    </div>
  </div>
</li>
