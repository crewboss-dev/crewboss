{# Task | Discussion (#830, #954): the way between a task and its Discussion on every screen. The Discussion opens only from here or the
   assistant button, never by itself. Both buttons are handled by js/ca.js (data-task-tab); the count is the number of conversations on the task. #}
<div class="task-tabs" role="tablist" aria-label="Task or discussion">
  <button type="button" role="tab" class="press" data-task-tab="task" aria-selected="true">Task</button>
  <button type="button" role="tab" class="press" data-task-tab="discussion" aria-selected="false">Discussion <span class="task-tab-n" data-ca-disc-count hidden></span></button>
</div>
