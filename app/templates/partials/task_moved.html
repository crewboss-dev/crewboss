{# The drawer after a task moved to another project: this page can't keep editing it, so say where it went. #}
<div class="flex flex-col items-start gap-3 py-6" role="status" data-task-moved>
  <span class="inline-flex items-center justify-center w-10 h-10 rounded-full bg-status-ok/15 text-status-ok" aria-hidden="true">
    <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
  </span>
  <div class="text-lead font-semibold">Moved to {{ target.name }}</div>
  <p class="text-small text-charcoal/60">#{{ task.id }} {{ task.title }}</p>
  <a href="/{{ target.slug }}/board?open={{ task.id }}" class="btn-primary text-small touch-target">Open it in {{ target.name }}</a>
</div>
